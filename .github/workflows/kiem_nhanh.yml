# Cong kiem chinh - chay tren MOI push va MOI pull request.
#
# Vi sao chi mot job, khong chia nhieu workflow nhu ke hoach ban dau:
#   Da DO THUC NGHIEM 2026-09-11 (giau thu muc ffmpeg/ di roi chay lai toan
#   bo): 43/43 bo kiem DAT tren may khong co ffmpeg, 0 bo phai bo qua, tong
#   79 giay. Cac bo E2E tu tim ffmpeg va co duong lui dang hoang. Vay khong
#   can tach "kiem nhanh" / "kiem day du", cung khong can cai ffmpeg trong
#   CI - them buoc cai chi lam cham va them mot diem hong.
#
#   Neu sau nay co bo kiem BAT BUOC phai co ffmpeg that, luc do moi tach.
#   Dung tach truoc khi can.
#
# MAX_BO_QUA=7: dung bang so bo THAT SU can ffmpeg de chay.
#
#   Ghi chu cu noi "MAX_BO_QUA=0, da do 43/43 DAT khi khong co ffmpeg".
#   Con so do DA LAC HAU: lan chay CI that 2026-09-11 co 6 bo bo qua va CI DO.
#   Nguyen nhan: tu lan do do den nay da them bo kiem moi, va mot so bo cu
#   (A7, DEM, #38, NUOT LOI, REVERSE) von VAN CAN ffmpeg - phep do cu dem
#   nham vi luc do may do co ffmpeg trong PATH.
#
#   Do lai 2026-09-11 bang cach giau CA thu muc ffmpeg/ LAN ffmpeg trong PATH:
#   dung 7 bo bo qua, 0 bo that bai. Nen nguong la 7.
#
# Vi sao van giu mot nguong thay vi bo han: nguong chan duoc kieu hong
# "lang le tut so bo chay that" (nhom C trong bug.md). Neu mot ngay nao do
# co bo thu 8 bo qua, CI se DO va bat phai giai thich.
#
# Moi bo bo qua VAN phai tu khai ly do (dong bat dau bang "BO QUA:"), nen
# khong the giau mot bo hong duoi vo boc "bo qua".

name: Kiem thu

on:
  push:
  pull_request:
  workflow_dispatch:

# Huy lan chay cu khi co push moi tren cung nhanh - tiet kiem phut CI.
concurrency:
  group: kiem-thu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-thu:
    name: Bo kiem tren Windows
    runs-on: windows-latest
    timeout-minutes: 20

    # Chi chay Windows. Tool chi ho tro Windows; chay Linux se do hang loat vi
    # backslash va `_lp()` - CI do oan la rui ro R-05 trong RISK.md.
    strategy:
      fail-fast: false
      matrix:
        # 3.14 = ban di kem repo (nguoi dung chay ban nay)
        # 3.8  = nguong toi thieu tuyen bo o BAN_GIAO.md va kiem trong .bat
        python: ["3.14", "3.8"]

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Khai bao moi truong
        shell: bash
        run: |
          echo "Python: $(python --version)"
          echo "Thu muc ffmpeg/ co trong repo khong? (mong doi: KHONG)"
          test -d ffmpeg && echo "  CO" || echo "  KHONG - dung nhu mong doi"

      - name: Chay toan bo bo kiem
        shell: bash
        env:
          # Runner sach KHONG co ffmpeg -> dung 7 bo khong chay duoc.
          # Do that 2026-09-11 (giau ca thu muc ffmpeg/ lan ffmpeg trong PATH):
          # 7 bo qua, 0 that bai. Moi bo deu tu khai ly do.
          MAX_BO_QUA: "7"
        run: python tests/chay_het.py

      - name: Giu lai bao cao khi that bai
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-that-bai-py${{ matrix.python }}
          path: |
            **/_BAO_CAO_THIEU.txt
            **/_LOI_GIAO_DIEN.log
          if-no-files-found: ignore
          retention-days: 14
